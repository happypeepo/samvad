// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Needed so the app module can compile SamvadBlePeripheralPlugin.kt (Kotlin).
        // Kept as a literal (not rootProject.ext.kotlin_version) because this
        // buildscript block is evaluated before variables.gradle is applied
        // below — must stay in sync with variables.gradle's kotlin_version.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
